[package]
name = "ragtag"
kind = "tool"
version = "2.1.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/ragtag"

[command]
name = "taf-ragtag"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/ragtag:2.1.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["genome-assembly", "assembly-scaffolding", "assembly-curation", "comparative-genomics", "reference-guided-assembly"]
keywords = ["RagTag", "scaffolding", "assembly correction", "assembly patching", "AGP", "PAF", "delta", "minimap2", "unimap", "nucmer", "MUMmer"]
description = "RagTag 2.1.0 command-line runtime for reference-guided assembly correction, scaffolding, patching, scaffold merging, and AGP/PAF/Delta assembly utilities."

[upstream]
name = "RagTag"
type = "github"
repo = "malonge/RagTag"
homepage = "https://github.com/malonge/RagTag"
manual = "https://github.com/malonge/RagTag/wiki"
release_url = "https://github.com/malonge/RagTag/releases/tag/v2.1.0"
downloads = "https://github.com/malonge/RagTag/archive/refs/tags/v2.1.0.tar.gz"
version = "2.1.0"
license = "MIT"
citation = "Alonge et al. 2022, Automated assembly scaffolding elevates a new tomato system for high-throughput genome editing"
doi = "10.1186/s13059-022-02823-7"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["ragtag.py", "ragtag_correct.py", "ragtag_scaffold.py", "ragtag_patch.py", "ragtag_merge.py", "ragtag_agp2fa.py", "ragtag_agpcheck.py", "ragtag_asmstats.py", "ragtag_delta2paf.py", "ragtag_paf2delta.py", "ragtag_splitasm.py", "ragtag_update_gff.py", "ragtag_rename.py", "ragtag_stats.py", "minimap2", "unimap", "nucmer", "delta-filter", "show-coords", "samtools", "python3", "bash", "grep", "sed", "ldd"]
test = ["ragtag.py --version | grep -Fx 'v2.1.0' >/dev/null", "ragtag.py --help 2>&1 | grep -F 'Tools for fast and flexible genome assembly scaffolding' >/dev/null && ragtag.py scaffold --help 2>&1 | grep -F 'Homology-based assembly scaffolding' >/dev/null && ragtag.py patch --help 2>&1 | grep -F 'Homology-based assembly patching' >/dev/null", "minimap2 --version | grep -Fx '2.31-r1302' >/dev/null && unimap --version | grep -Fx '0.1-r41' >/dev/null && nucmer -V 2>&1 | grep -Fx '4.0.1' >/dev/null && samtools --version 2>&1 | grep -F 'samtools' >/dev/null", "python3 -c 'import ragtag_utilities, intervaltree, networkx, numpy, pysam; print(\"ok\")' | grep -Fx 'ok' >/dev/null", "for cmd in minimap2 unimap nucmer delta-filter show-coords; do ldd \"$(command -v \"$cmd\")\" 2>&1 | grep -F 'not found' && exit 1 || true; done", "tmp=/tmp/taf-ragtag-smoke-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cd \"$tmp\"; python3 -c 'import random; random.seed(7); seq = \"\".join(random.choice(\"ACGT\") for _ in range(30000)); open(\"ref.fa\", \"w\").write(\">ref\\n\" + seq + \"\\n\"); open(\"query.fa\", \"w\").write(\">ctg1\\n\" + seq + \"\\n\")'; ragtag.py scaffold -f 1000 -t 1 -o mm2 ref.fa query.fa > mm2.log 2>&1 || { cat mm2.log >&2; exit 1; }; test -s mm2/ragtag.scaffold.agp; test -s mm2/ragtag.scaffold.fasta; grep -F 'ctg1' mm2/ragtag.scaffold.agp >/dev/null; ragtag.py agpcheck mm2/ragtag.scaffold.agp > agpcheck.txt 2>&1; grep -F 'complete with no errors' agpcheck.txt >/dev/null; ragtag.py asmstats mm2/ragtag.scaffold.fasta > asmstats.tsv; grep -F 'N50' asmstats.tsv >/dev/null; ragtag.py scaffold --aligner nucmer --nucmer-params '--maxmatch -l 100 -c 500' -f 1000 -o nucmer ref.fa query.fa > nucmer.log 2>&1 || { cat nucmer.log >&2; exit 1; }; test -s nucmer/ragtag.scaffold.agp; unimap -b24 -c ref.fa query.fa > unimap.paf 2> unimap.log || { cat unimap.log >&2; exit 1; }; test -s unimap.paf; rm -rf \"$tmp\""]
