[package]
name = "ragtag"
kind = "tool"
version = "2.1.1"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/ragtag"

[command]
name = "taf-ragtag"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/ragtag:2.1.1-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["genome-assembly", "assembly-scaffolding", "assembly-curation", "comparative-genomics", "reference-guided-assembly"]
keywords = ["RagTag", "scaffolding", "assembly correction", "assembly patching", "AGP", "PAF", "delta", "minimap2", "unimap", "nucmer", "MUMmer"]
description = "RagTag 2.1.1 command-line runtime for reference-guided assembly correction, scaffolding, patching, scaffold merging, and AGP/PAF/Delta assembly utilities."

[upstream]
name = "RagTag"
type = "github"
repo = "malonge/RagTag"
homepage = "https://github.com/malonge/RagTag"
manual = "https://github.com/malonge/RagTag/wiki"
release_url = "https://github.com/malonge/RagTag/releases/tag/v2.1.1"
downloads = "https://github.com/malonge/RagTag/archive/refs/tags/v2.1.1.tar.gz"
version = "2.1.1"
commit = "179158843b010fbb677ed03528efa44f79f88f5e"
license = "MIT"
citation = "Alonge et al. 2022, Automated assembly scaffolding elevates a new tomato system for high-throughput genome editing"
doi = "10.1186/s13059-022-02823-7"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 300
exist = ["ragtag.py", "ragtag_correct.py", "ragtag_scaffold.py", "ragtag_patch.py", "ragtag_merge.py", "ragtag_agp2fa.py", "ragtag_agpcheck.py", "ragtag_asmstats.py", "ragtag_delta2paf.py", "ragtag_paf2delta.py", "ragtag_splitasm.py", "ragtag_update_gff.py", "ragtag_rename.py", "ragtag_stats.py", "ragtag_break_query.py", "ragtag_create_links.py", "ragtag-smoke", "minimap2", "unimap", "nucmer", "delta-filter", "show-coords", "mummerplot", "gnuplot", "samtools", "bgzip", "tabix", "python3", "perl", "bash", "sh", "awk", "grep", "sed", "ldd"]
test = ["ragtag-smoke identity", "ragtag-smoke interface", "ragtag-smoke linkage", "ragtag-smoke reverse-merge", "ragtag-smoke scaffold-minimap2", "ragtag-smoke scaffold-unimap", "ragtag-smoke scaffold-nucmer", "ragtag-smoke correct", "ragtag-smoke patch", "ragtag-smoke merge", "ragtag-smoke utilities", "ragtag-smoke plot", "ragtag-smoke errors"]
